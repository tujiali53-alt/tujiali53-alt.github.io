      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#f5f0e5"/>
    </linearGradient>
    <pattern id="grain" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="7" r="1" fill="#6b5c83" opacity=".05"/>
      <circle cx="18" cy="15" r="1" fill="#6b5c83" opacity=".035"/>
    </pattern>
  </defs>
  <rect width="1200" height="760" rx="34" fill="url(#paper)"/>
